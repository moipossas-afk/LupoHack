[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lupohack"
version = "1.0.0"
description = "Local defensive cybersecurity toolkit"
readme = "README.md"
requires-python = ">=3.11"
# License metadata is intentionally omitted until the project owner selects a license.
authors = [{name = "LupoHack contributors"}]
dependencies = ["dnspython>=2.6,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.6,<1"]

[project.scripts]
lupohack = "lupohack.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
